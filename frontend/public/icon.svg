<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
    <defs>
        <radialGradient id="sky" cx="35%" cy="35%" r="75%">
            <stop offset="0%" stop-color="#1a2540"/>
            <stop offset="60%" stop-color="#0c1326"/>
            <stop offset="100%" stop-color="#05080f"/>
        </radialGradient>
        <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4cb4ff"/>
            <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>
        <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fafafa"/>
            <stop offset="100%" stop-color="#c4cad8"/>
        </linearGradient>
    </defs>

    <rect width="256" height="256" rx="56" fill="url(#sky)"/>

    <!-- Constellation dots -->
    <g fill="#ffffff" opacity="0.85">
        <circle cx="40"  cy="50"  r="1.4"/>
        <circle cx="70"  cy="28"  r="1.0"/>
        <circle cx="110" cy="40"  r="1.6"/>
        <circle cx="55"  cy="90"  r="1.0"/>
        <circle cx="30"  cy="130" r="1.2"/>
        <circle cx="210" cy="60"  r="1.4"/>
        <circle cx="230" cy="110" r="1.0"/>
        <circle cx="195" cy="190" r="1.2"/>
        <circle cx="50"  cy="205" r="1.4"/>
        <circle cx="95"  cy="225" r="1.0"/>
        <circle cx="160" cy="235" r="1.0"/>
        <circle cx="165" cy="35"  r="2.0"/>
    </g>

    <!-- Outer ring (instrument bezel) -->
    <circle cx="128" cy="128" r="82" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.85"/>
    <circle cx="128" cy="128" r="74" fill="none" stroke="#4cb4ff" stroke-width="1" opacity="0.45"/>

    <!-- Tick marks -->
    <g stroke="#4cb4ff" stroke-width="2" opacity="0.9">
        <line x1="128" y1="38"  x2="128" y2="50"/>
        <line x1="128" y1="206" x2="128" y2="218"/>
        <line x1="38"  y1="128" x2="50"  y2="128"/>
        <line x1="206" y1="128" x2="218" y2="128"/>
    </g>

    <!-- Crescent moon -->
    <g>
        <circle cx="128" cy="128" r="52" fill="url(#moon)"/>
        <circle cx="148" cy="118" r="50" fill="url(#sky)"/>
    </g>

    <!-- Small crater hint -->
    <circle cx="112" cy="144" r="4" fill="#c4cad8" opacity="0.6"/>
    <circle cx="98" cy="130" r="2.5" fill="#c4cad8" opacity="0.5"/>
</svg>
